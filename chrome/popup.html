<!doctype html><html><head><meta charset="utf-8"><title>EMPsize</title><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--blue:#2563eb}
body{font:15px -apple-system,system-ui,sans-serif;min-width:260px;max-width:420px;margin:0;padding:14px}
h1{font-size:16px;margin:0 0 10px}
.big{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border-radius:14px;background:#f1f5f9;cursor:pointer;user-select:none}
.big .t{font-size:18px;font-weight:700}.big .h{font-size:12px;color:#64748b;word-break:break-all}
.sw{position:relative;display:inline-block;width:64px;height:36px;flex:none;margin:0;cursor:pointer}.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;background:#cbd5e1;border-radius:36px;transition:.15s}
.sw span:before{content:"";position:absolute;width:30px;height:30px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 3px #0003}
.sw input:checked+span{background:var(--blue)}.sw input:checked+span:before{transform:translateX(28px)}
.sw input:disabled+span{opacity:.4}
.row{display:flex;align-items:center;justify-content:space-between;margin:12px 2px}
.sm{transform:scale(.75);transform-origin:right}
details{margin-top:6px;border-top:1px solid #e2e8f0;padding-top:8px}summary{cursor:pointer;font-weight:600;padding:6px 0}
details label:not(.sw){display:flex;justify-content:space-between;align-items:center;margin:10px 0 2px}input[type=range]{width:100%;height:30px}
small{color:#64748b;display:block;margin-top:8px}
@media (prefers-color-scheme:dark){body{background:#1c1c1e;color:#eee}.big{background:#2c2c2e}small,.big .h{color:#aaa}details{border-color:#3a3a3c}}
</style></head><body>
<h1><b>EMP</b>size</h1>
<label class="big" for="site"><div><div class="t" id="state">Off</div><div class="h" id="host">this site</div></div>
  <span class="sw"><input type="checkbox" id="site"><span></span></span></label>
<div class="row"><span>All sites (default)</span><label class="sw sm"><input type="checkbox" id="global"><span></span></label></div>
<details><summary>More</summary>
<label>Fixation (bold amount) <span id="fv"></span></label><input type="range" id="fixation" min="1" max="5" step="1">
<label>Saccade (word skip) <span id="sv"></span></label><input type="range" id="saccade" min="1" max="5" step="1">
<label>Bold opacity <span id="ov"></span></label><input type="range" id="opacity" min="80" max="100" step="5">
<div class="row"><span>Dim the rest</span><label class="sw sm"><input type="checkbox" id="dim"><span></span></label></div>
<small id="sc">Shortcut: Alt+B toggles this site (change at chrome://extensions/shortcuts).</small>
</details>
<script src="popup.js"></script></body></html>
